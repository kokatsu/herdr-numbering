# Prefixes each tab name with its position on the tab bar (as "[N]") and each
# workspace name with its position in the sidebar (as "(N)"); both formats are
# configurable.
# See README.md for install steps and the reasoning behind the design.
id = "kokatsu.tab-numbers"
name = "Tab & Workspace Numbers"
version = "0.2.0"
min_herdr_version = "0.8.2"
description = "Prefix tab and workspace names with their switch position"
platforms = ["linux", "macos"]

# Positions are reassigned whenever tabs are added, removed, or reordered, so
# every event that can change the set of tabs renumbers all of them. startup is
# not such an event; it covers recovery after a server restart or a live handoff
[[startup]]
command = ["bash", "renumber.sh"]

[[events]]
on = "tab.created"
command = ["bash", "renumber.sh"]

[[events]]
on = "tab.closed"
command = ["bash", "renumber.sh"]

[[events]]
on = "tab.moved"
command = ["bash", "renumber.sh"]

# Closing the last pane of a tab does not emit tab.closed, so the pane-side
# events are watched as well (this is the path taken when panes are folded away
# one at a time with prefix+x). When no tab disappears, the run finds no
# difference and exits without issuing a rename
[[events]]
on = "pane.closed"
command = ["bash", "renumber.sh"]

[[events]]
on = "pane.exited"
command = ["bash", "renumber.sh"]

# Restore the [N] that a manual rename dropped. This re-fires on the plugin's
# own rename too, but the second pass finds no difference and issues no rename,
# so it converges
[[events]]
on = "tab.renamed"
command = ["bash", "renumber.sh"]

# Workspace numbers reflow on their own (herdr keeps `number` equal to the
# sidebar position, closing a workspace renumbers the rest), so only the events
# that change the set or the order of workspaces need to re-run the script.
# workspace.renamed restores the number prefix a manual rename dropped,
# converging the same way tab.renamed does
[[events]]
on = "workspace.created"
command = ["bash", "renumber.sh"]

[[events]]
on = "workspace.closed"
command = ["bash", "renumber.sh"]

[[events]]
on = "workspace.moved"
command = ["bash", "renumber.sh"]

[[events]]
on = "workspace.reordered"
command = ["bash", "renumber.sh"]

[[events]]
on = "workspace.renamed"
command = ["bash", "renumber.sh"]
